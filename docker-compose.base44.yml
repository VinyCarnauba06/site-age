services:
  web:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --no-open"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
